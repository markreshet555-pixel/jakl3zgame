<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traditional Japanese Garden & Sakura</title>
    <style>
        body {
            background-color: #fdfbf7;
            color: #4a403a;
            font-family: 'Georgia', serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background-color: #fff9f5;
            border: 1px solid #e8d3c7;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(180, 140, 130, 0.15);
            text-align: center;
            width: 480px;
        }
        .sakura-icon {
            font-size: 42px;
            color: #e07a93;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 20px;
            color: #5c4033;
            letter-spacing: 2px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }
        .quote {
            font-size: 15px;
            line-height: 1.8;
            color: #6b5b52;
            min-height: 80px;
            margin-bottom: 30px;
            border-left: 3px solid #e07a93;
            padding-left: 15px;
            text-align: left;
            font-style: italic;
        }
        button {
            background-color: #e07a93;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-family: 'Georgia', serif;
            font-size: 14px;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.3s ease;
            width: 100%;
        }
        button:hover {
            background-color: #c9657f;
        }
        .footer {
            margin-top: 25px;
            font-size: 12px;
            color: #b09b90;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="sakura-icon">🌸</div>
        <h1>Spring & Sakura / 桜</h1>
        
        <div class="quote" id="quote-display">
            "In the cherry blossom's shade there is no such thing as a stranger." — Kobayashi Issa
        </div>

        <button onclick="nextQuote()">Discover Wisdom / 禅</button>
        
        <div class="footer">TRADITIONAL JAPAN</div>
    </div>

    <script>
        const quotes = [
            { symbol: "🌸", text: "\"In the cherry blossom's shade there is no such thing as a stranger.\" — Kobayashi Issa" },
            { symbol: "🌿", text: "\"Fall seven times, stand up eight.\" — Japanese Proverb" },
            { symbol: "🍵", text: "\"The art of peace begins with yourself.\" — Morihei Ueshiba" },
            { symbol: "🌙", text: "\"The moon does not rival the sun, it simply shines in its own time.\" — Zen Wisdom" },
            { symbol: "🍃", text: "\"Walk softly, breathe deeply, let go.\" — Traditional Wisdom" }
        ];

        function nextQuote() {
            const rand = Math.floor(Math.random() * quotes.length);
            document.querySelector('.sakura-icon').innerText = quotes[rand].symbol;
            document.getElementById('quote-display').innerText = quotes[rand].text;
        }
    </script>
</body>
</html>
